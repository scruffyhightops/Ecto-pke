<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080b08">
<link rel="manifest" href="manifest.json">
<title>PKE Field Prototype v4</title>
<style>
:root{
  --green:#73ff73; --yellow:#ffe95a; --red:#ff4b3d; --orange:#ff9b38;
  --ink:#050705; --panel:#101610; --grid:rgba(115,255,115,.16);
  --font-tech:"Courier New",Courier,monospace;
  --font-ui:Eurostile,"Eurostile Extended","Microgramma","Arial Narrow",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#030403;color:var(--green);font-family:var(--font-tech);overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#app{width:min(100vw,430px);height:100dvh;min-height:650px;background:#080b08;display:flex;flex-direction:column;padding:14px 12px env(safe-area-inset-bottom) 12px;gap:9px}
.top{display:flex;justify-content:space-between;align-items:center;min-height:34px;border:1px solid rgba(115,255,115,.35);padding:5px 8px;letter-spacing:1px}
.brand{font-family:var(--font-ui);font-size:14px}.status{font-size:11px}
.readout{border:2px solid currentColor;padding:9px 10px 8px;text-align:center;background:#060906;box-shadow:inset 0 0 20px rgba(115,255,115,.06)}
.mode-name{font-family:var(--font-ui);font-size:13px;letter-spacing:2px;margin-bottom:3px}
.value{font-size:34px;line-height:1;font-weight:bold;letter-spacing:3px}
.units{font-size:10px;opacity:.75;margin-top:4px}
.screen{position:relative;flex:1;min-height:0;border:2px solid currentColor;background:#050805;overflow:hidden}
.screen:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px)}
.screen:after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:25px 25px;opacity:.8}
.mode{display:none;position:absolute;inset:0;padding:10px;z-index:1}
.mode.active{display:flex}
.screen.spd{color:var(--yellow)} .screen.spv{color:var(--red)} .screen.sdr{color:var(--green)}
/* SPD: three separate banks of full bargraphs */
.spd.active{flex-direction:column;gap:8px}
.bank{flex:1;min-height:0;border:1px solid currentColor;position:relative;padding:18px 6px 7px;background:rgba(0,0,0,.18)}
.bank-title{position:absolute;top:3px;left:6px;font-size:10px;letter-spacing:1px}
.bars{height:100%;display:grid;grid-template-columns:repeat(12,1fr);align-items:end;gap:3px}
.bar{height:10%;min-height:2px;background:currentColor;box-shadow:0 0 5px currentColor;transition:height .12s linear}
.scale{position:absolute;right:4px;top:18px;bottom:7px;font-size:8px;display:flex;flex-direction:column;justify-content:space-between;opacity:.65}
/* SPV */
.spv.active{flex-direction:column;gap:8px}
.vector-panel{flex:1;border:1px solid currentColor;position:relative}
.vector-grid{position:absolute;inset:8px;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr)}
.cell{border:1px solid rgba(255,75,61,.09)}
.signal-square{position:absolute;width:16px;height:16px;background:currentColor;box-shadow:0 0 10px currentColor;transform:translate(-50%,-50%)}
.vector-read{border:1px solid currentColor;padding:8px;font-size:11px;display:flex;justify-content:space-between;letter-spacing:1px}
/* SDR */
.sdr.active{flex-direction:column;gap:10px}
.energy-core{flex:1;border:1px solid currentColor;display:flex;align-items:center;justify-content:center;position:relative}
.core{width:min(52vw,190px);height:min(52vw,190px);border:4px solid currentColor;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);padding:12px;gap:4px;box-shadow:0 0 18px currentColor}
.core-cell{border:1px solid currentColor;opacity:.9}
.decay-stack{border:1px solid currentColor;padding:8px}
.decay-bars{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;height:35px}
.decay-bar{background:currentColor;box-shadow:0 0 5px currentColor}
.decay-label{display:flex;justify-content:space-between;font-size:10px;margin-top:5px}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
button{font:12px var(--font-ui);color:#d9ffd9;background:#101610;border:1px solid #5cae5c;border-radius:2px;min-height:44px;letter-spacing:1px}
button:active{transform:translateY(1px);background:#1a241a}
button.selected{border-width:2px;box-shadow:inset 0 0 12px rgba(255,255,255,.08)}
.settings{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.settings button{min-height:48px}
#spdBtn{color:var(--yellow);border-color:var(--yellow)}
#spvBtn{color:var(--red);border-color:var(--red)}
#sdrBtn{color:var(--green);border-color:var(--green)}
.power{width:100%;min-height:52px;font-size:15px}
.off .screen,.off .readout{opacity:.35}
@media(max-height:720px){#app{gap:6px;padding-top:8px}.top{min-height:28px}.value{font-size:29px}.controls button,.settings button{min-height:40px}.power{min-height:46px}}
</style>
</head>
<body>
<div id="app" class="off">
  <div class="top"><span class="brand">PKE FIELD ANALYSER</span><span class="status" id="status">STANDBY</span></div>
  <div class="readout">
    <div class="mode-name" id="modeName">SYSTEM OFFLINE</div>
    <div class="value" id="value">00000.0</div>
    <div class="units">PKE FIELD INDEX</div>
  </div>

  <div class="screen spd" id="screen">
    <section class="mode spd active" id="spdMode">
      <div class="bank"><div class="bank-title">PARTICLE DENSITY / PRIMARY</div><div class="bars" id="spdA"></div><div class="scale"><span>HIGH</span><span>50</span><span>0</span></div></div>
      <div class="bank"><div class="bank-title">PARTICLE DENSITY / SECONDARY</div><div class="bars" id="spdB"></div></div>
      <div class="bank"><div class="bank-title">FIELD INSTABILITY</div><div class="bars" id="spdC"></div></div>
    </section>

    <section class="mode spv" id="spvMode">
      <div class="vector-panel" id="vectorPanel">
        <div class="vector-grid" id="vectorGrid"></div>
      </div>
      <div class="vector-read"><span>DIRECTIONAL VECTOR FIELD</span><span id="vectorText">0.0 / 0°</span></div>
    </section>

    <section class="mode sdr" id="sdrMode">
      <div class="energy-core"><div class="core" id="core"></div></div>
      <div class="decay-stack">
        <div class="decay-bars" id="decayBars"></div>
        <div class="decay-label"><span>SPECTRAL ENERGY REMAINING</span><span id="decayText">100%</span></div>
      </div>
    </section>
  </div>

  <div class="settings">
    <button id="spdBtn" class="selected">SPD</button>
    <button id="spvBtn">SPV</button>
    <button id="sdrBtn">SDR</button>
  </div>
  <div class="controls">
    <button id="auto">AUTO</button><button id="hold">HOLD</button><button id="up">UP</button><button id="down">DOWN</button>
  </div>
  <button class="power" id="power">ACTIVATE</button>
</div>
<script>
const app=document.getElementById('app'), valueEl=document.getElementById('value'), modeName=document.getElementById('modeName'), statusEl=document.getElementById('status');
const screen=document.getElementById('screen');
const modes={SPD:document.getElementById('spdMode'),SPV:document.getElementById('spvMode'),SDR:document.getElementById('sdrMode')};
const buttons={SPD:document.getElementById('spdBtn'),SPV:document.getElementById('spvBtn'),SDR:document.getElementById('sdrBtn')};
let active=false, auto=false, hold=false, mode='SPD', value=7600, timer=null, phase=0;

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function severity(){return clamp((5000-value)/5000,0,1)}
function fmt(v){return v.toFixed(1).padStart(7,'0')}
function setMode(m){
  mode=m;
  Object.entries(modes).forEach(([k,el])=>el.classList.toggle('active',k===m));
  Object.entries(buttons).forEach(([k,b])=>b.classList.toggle('selected',k===m));
  screen.className='screen '+m.toLowerCase();
  modeName.textContent=m==='SPD'?'SPECTRAL PARTICLE DENSITY':m==='SPV'?'SPECTRAL VELOCITY':'SPECTRAL DECAY RATE';
  render();
}
function render(){
  valueEl.textContent=fmt(value);
  if(!active){modeName.textContent='SYSTEM OFFLINE';statusEl.textContent='STANDBY';return}
  statusEl.textContent=hold?'HOLD':(auto?'AUTO SCAN':'MANUAL');
  if(mode==='SPD') renderSPD();
  if(mode==='SPV') renderSPV();
  if(mode==='SDR') renderSDR();
}
function makeBars(id,n=12){
  const el=document.getElementById(id); el.innerHTML='';
  for(let i=0;i<n;i++){const b=document.createElement('div');b.className='bar';el.appendChild(b)}
}
['spdA','spdB','spdC'].forEach(id=>makeBars(id));
for(let i=0;i<81;i++){const c=document.createElement('div');c.className='cell';document.getElementById('vectorGrid').appendChild(c)}
for(let i=0;i<36;i++){const c=document.createElement('div');c.className='core-cell';document.getElementById('core').appendChild(c)}
for(let i=0;i<20;i++){const b=document.createElement('div');b.className='decay-bar';document.getElementById('decayBars').appendChild(b)}
for(let i=0;i<7;i++){const s=document.createElement('div');s.className='signal-square';document.getElementById('vectorPanel').appendChild(s)}

function renderSPD(){
  const s=severity(), ids=['spdA','spdB','spdC'];
  ids.forEach((id,bank)=>{
    [...document.getElementById(id).children].forEach((b,i)=>{
      const wave=Math.sin(i*.72+phase*(1+bank*.25))*0.12;
      const jitter=(Math.sin(i*2.9+phase*3.1+bank)*.5+.5)*s*.35;
      const base=(.08+s*(.72-(bank*.08)));
      const h=clamp((base+wave+jitter)*100,3,100);
      b.style.height=h+'%';
    });
  });
}
function renderSPV(){
  const s=severity(), speed=(s*9.8).toFixed(1), angle=Math.round((phase*28+s*150)%360);
  document.getElementById('vectorText').textContent=speed+' / '+angle+'°';
  const squares=document.querySelectorAll('.signal-square');
  const cx=50,cy=50, rad=12+s*30;
  squares.forEach((sq,i)=>{
    const t=(i-3)*.72 + phase*.12;
    const x=cx+Math.cos(t)*(rad*(i+1)/7);
    const y=cy+Math.sin(t)*(rad*(i+1)/7);
    sq.style.left=x+'%';sq.style.top=y+'%';
    sq.style.opacity=(.35+s*.65)*(1-i*.045);
    const size=8+s*12+(i%2)*2;
    sq.style.width=size+'px';sq.style.height=size+'px';
  });
}
function renderSDR(){
  const s=severity(), remaining=1-s;
  document.getElementById('decayText').textContent=Math.round(remaining*100)+'%';
  [...document.getElementById('decayBars').children].forEach((b,i)=>b.style.opacity=i/20<remaining?1:.12);
  [...document.getElementById('core').children].forEach((c,i)=>{
    const threshold=(i+1)/36;
    c.style.opacity=threshold<remaining ? .9 : .08;
  });
  document.getElementById('core').style.transform=`scale(${.76+remaining*.24}) rotate(${phase*2}deg)`;
}
function step(delta){if(!active)return; hold=false; auto=false; value=clamp(value+delta,0,10000); render()}
function tick(){
  if(!active||hold||!auto)return;
  const s=severity();
  value=clamp(value + (Math.random()-.5)*700 - s*120,0,10000);
  phase+=.35; render();
}
document.getElementById('power').onclick=()=>{
  active=!active;
  app.classList.toggle('off',!active);
  document.getElementById('power').textContent=active?'DEACTIVATE':'ACTIVATE';
  if(active){value=7600;auto=true;hold=false;mode='SPD';setMode('SPD');}
  else{auto=false;hold=false;render()}
};
document.getElementById('auto').onclick=()=>{if(active){auto=true;hold=false;render()}};
document.getElementById('hold').onclick=()=>{if(active){hold=!hold;render()}};
document.getElementById('up').onclick=()=>step(250);
document.getElementById('down').onclick=()=>step(-250);
Object.entries(buttons).forEach(([m,b])=>b.onclick=()=>{if(active)setMode(m)});
setInterval(()=>{if(active){phase+=.08;tick();if(!auto&&!hold)render()}},100);
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script>
</body>
</html>
