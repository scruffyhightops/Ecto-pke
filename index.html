<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1408">
<title>PKE Meter</title>
<link rel="manifest" id="manifest">
<style>
  :root{
    --green:#2bff5e;
    --screen-bg:#0a1408;
    --panel:#111a10;
    --btn:#1a2418;
    --btn-border:#3a4a36;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:#050805;
    color:var(--green);
    font-family:'Courier New',monospace;
    display:flex; align-items:center; justify-content:center;
    padding:12px;
    min-height:100%;
  }
  .meter{
    width:100%; max-width:720px;
    background:var(--panel);
    border:2px solid var(--btn-border);
    border-radius:10px;
    padding:14px;
    box-shadow:0 0 30px rgba(43,255,94,.15) inset, 0 0 20px rgba(0,0,0,.8);
  }
  /* ---- SCREEN ---- */
  .screen{
    position:relative;
    background:var(--screen-bg);
    border:2px solid #2a3a26;
    border-radius:6px;
    overflow:hidden;
    height:340px;
    display:flex; flex-direction:column;
  }
  .screen::after{ /* scanlines */
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(43,255,94,.06) 0px,
      rgba(43,255,94,.06) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
    z-index:5;
  }
  .screen::before{ /* green tinge */
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(ellipse at center, rgba(43,255,94,.10), rgba(0,0,0,.35));
    pointer-events:none;
    z-index:4;
  }
  /* grid */
  .grid{
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(43,255,94,.18) 1px, transparent 1px),
      linear-gradient(90deg, rgba(43,255,94,.18) 1px, transparent 1px);
    background-size:16.66% 16.66%;
    z-index:1;
  }
  .sweep{
    position:absolute; top:0; bottom:0; width:2px;
    background:rgba(43,255,94,.5);
    box-shadow:0 0 12px rgba(43,255,94,.8);
    z-index:2; left:0;
    animation:sweep 6s linear infinite;
  }
  @keyframes sweep{ from{left:0} to{left:100%} }

  /* waveform canvas */
  #wave{
    position:absolute; inset:0;
    width:100%; height:100%;
    z-index:3;
  }

  /* readout row */
  .readout{
    position:absolute; bottom:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 12px;
    background:rgba(5,10,5,.85);
    border-top:1px solid rgba(43,255,94,.25);
    z-index:6;
    font-size:14px;
  }
  #pkeVal{
    font-size:26px; font-weight:bold;
    letter-spacing:2px;
    text-shadow:0 0 8px currentColor;
  }
  .status{font-size:11px; opacity:.8; letter-spacing:1px;}

  /* ---- CONTROLS ---- */
  .controls{ margin-top:14px; }
  .mode-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px; margin-bottom:12px;
  }
  .btn{
    background:var(--btn);
    color:var(--green);
    border:2px solid var(--btn-border);
    border-radius:6px;
    padding:12px 0;
    font-family:inherit; font-size:15px; font-weight:bold;
    letter-spacing:1px;
    cursor:pointer;
    text-shadow:0 0 6px currentColor;
    transition:all .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{ transform:scale(.96); }
  .btn.active{
    background:var(--green);
    color:#041005;
    border-color:var(--green);
    text-shadow:none;
    box-shadow:0 0 16px rgba(43,255,94,.6);
  }
  .scan-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .scan-btn{
    font-size:34px; line-height:1;
    padding:14px 0;
  }
  .gain{
    text-align:center; margin-top:10px;
    font-size:12px; letter-spacing:1px; opacity:.7;
  }
</style>
</head>
<body>
<div class="meter">
  <div class="screen">
    <div class="grid"></div>
    <div class="sweep"></div>
    <canvas id="wave"></canvas>
    <div class="readout">
      <span class="status" id="status">AUTO</span>
      <span id="pkeVal">0.00</span>
    </div>
  </div>

  <div class="controls">
    <div class="mode-row">
      <button class="btn active" id="autoBtn">AUTO</button>
      <button class="btn" id="holdBtn">HOLD</button>
      <button class="btn active" id="waveBtn">WAVE</button>
      <button class="btn" id="graphBtn">GRAPH</button>
    </div>
    <div class="scan-row">
      <button class="btn scan-btn" id="plusBtn">+</button>
      <button class="btn scan-btn" id="minusBtn">−</button>
    </div>
    <div class="gain">SCAN SENSITIVITY <span id="gainVal">100%</span></div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('wave');
  const ctx = canvas.getContext('2d');
  const pkeVal = document.getElementById('pkeVal');
  const statusEl = document.getElementById('status');
  const gainVal = document.getElementById('gainVal');

  let mode = 'AUTO';      // AUTO | HOLD
  let display = 'WAVE';   // WAVE | GRAPH
  let gain = 1.0;
  let strength = 0.3;     // current 0..1
  let heldStrength = 0.3;
  let time = 0;

  // --- color ramp: green -> yellow -> orange -> red ---
  function colorFor(s){
    const stops = [
      [0.0,  43,255, 94],   // green
      [0.4, 170,255, 60],   // yellow-green
      [0.6, 255,220, 60],   // yellow
      [0.8, 255,130, 40],   // orange
      [1.0, 255, 40, 40]    // red
    ];
    let c = stops[0];
    for(let i=0;i<stops.length-1;i++){
      const a=stops[i], b=stops[i+1];
      if(s>=a[0] && s<=b[0]){
        const t=(s-a[0])/(b[0]-a[0]||1);
        c=[0, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t, a[3]+(b[3]-a[3])*t];
        break;
      }
    }
    return `rgb(${c[1]|0},${c[2]|0},${c[3]|0})`;
  }

  function resize(){
    const r = canvas.parentElement.getBoundingClientRect();
    canvas.width = r.width;
    canvas.height = r.height;
  }
  window.addEventListener('resize', resize);
  resize();

  // --- auto signal: random walk with occasional spikes ---
  function updateAuto(){
    const drift = (Math.random()-0.5)*0.06;
    strength = Math.min(1, Math.max(0.05, strength + drift));
    // occasional spike
    if(Math.random() < 0.03){
      strength = Math.min(1, strength + 0.2 + Math.random()*0.4);
    }
    // decay back down
    strength = Math.max(0.05, strength - 0.004);
    strength *= gain;
    strength = Math.min(1, strength);
  }

  function draw(){
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0,0,w,h);

    const s = mode==='HOLD' ? heldStrength : strength;
    const col = colorFor(s);

    if(display === 'WAVE'){
      // sine wave with noise, amplitude from strength
      ctx.beginPath();
      const amp = (h*0.35) * (0.3 + s*0.9);
      const mid = h/2;
      for(let x=0; x<=w; x+=2){
        const t = x/w;
        const y = mid
          + Math.sin(t*Math.PI*2*3 + time)*amp*0.6
          + Math.sin(t*Math.PI*2*7 + time*1.7)*amp*0.3
          + Math.sin(t*Math.PI*2*13 + time*2.3)*amp*0.1;
        x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.5;
      ctx.shadowColor = col;
      ctx.shadowBlur = 12;
      ctx.stroke();
      ctx.shadowBlur = 0;
    } else {
      // bar graph
      const bars = 24;
      const bw = w/bars;
      const base = h*0.9;
      for(let i=0;i<bars;i++){
        const t = i/bars;
        const bh = (h*0.85) * Math.abs(Math.sin(t*Math.PI*2*3 + time)*0.6 + Math.sin(t*Math.PI*2*7 + time*1.7)*0.3 + Math.sin(t*Math.PI*2*13 + time*2.3)*0.1);
        const bh2 = bh * (0.3 + s*0.9);
        ctx.fillStyle = colorFor(s * (0.5 + Math.abs(Math.sin(t*Math.PI + time))*0.5));
        ctx.fillRect(i*bw+2, base-bh2, bw-4, bh2);
      }
    }

    // update readout
    const val = s*9.99;
    pkeVal.textContent = val.toFixed(2);
    pkeVal.style.color = col;
    pkeVal.style.textShadow = `0 0 10px ${col}`;
  }

  function loop(){
    time += 0.05;
    if(mode==='AUTO') updateAuto();
    draw();
    requestAnimationFrame(loop);
  }

  // --- controls ---
  const setActive = (btn, group)=>{
    group.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  };

  const autoBtn=document.getElementById('autoBtn');
  const holdBtn=document.getElementById('holdBtn');
  const waveBtn=document.getElementById('waveBtn');
  const graphBtn=document.getElementById('graphBtn');
  const plusBtn=document.getElementById('plusBtn');
  const minusBtn=document.getElementById('minusBtn');

  autoBtn.onclick=()=>{
    mode='AUTO'; setActive(autoBtn,[autoBtn,holdBtn]);
    statusEl.textContent='AUTO';
  };
  holdBtn.onclick=()=>{
    heldStrength=strength; mode='HOLD'; setActive(holdBtn,[autoBtn,holdBtn]);
    statusEl.textContent='HOLD';
  };
  waveBtn.onclick=()=>{ display='WAVE'; setActive(waveBtn,[waveBtn,graphBtn]); };
  graphBtn.onclick=()=>{ display='GRAPH'; setActive(graphBtn,[waveBtn,graphBtn]); };

  plusBtn.onclick=()=>{ gain=Math.min(2, gain+0.25); gainVal.textContent=Math.round(gain*100)+'%'; };
  minusBtn.onclick=()=>{ gain=Math.max(0.25, gain-0.25); gainVal.textContent=Math.round(gain*100)+'%'; };

  // --- PWA: manifest + service worker ---
  const manifest = {
    name:"PKE Meter", short_name:"PKE",
    start_url:".", display:"standalone",
    background_color:"#050805", theme_color:"#0a1408",
    icons:[{src:"data:image/svg+xml,"+encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#0a1408"/><text x="50" y="65" font-size="50" text-anchor="middle" fill="#2bff5e" font-family="monospace">P</text></svg>`
    ), sizes:"any", type:"image/svg+xml", purpose:"any"}]
  };
  document.getElementById('manifest').setAttribute('href',
    'data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest)));

  if('serviceWorker' in navigator){
    const sw = `
      const CACHE='pke-v1';
      self.addEventListener('install',e=>{self.skipWaiting()});
      self.addEventListener('activate',e=>{e.waitUntil(clients.claim())});
      self.addEventListener('fetch',e=>{
        if(e.request.method!=='GET')return;
        e.respondWith(
          caches.open(CACHE).then(c=>c.match(e.request)).then(r=>r||fetch(e.request))
        );
      });`;
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'text/javascript'})));
  }

  loop();
})();
</script>
</body>
</html>
