<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090909">
<link rel="manifest" href="manifest.json">
<title>PKE Prototype</title>
<style>
:root{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#eee;background:#090909}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 20%,#292929,#070707 70%);display:flex;justify-content:center;overflow:hidden}
.app{width:min(100%,430px);min-height:100svh;padding:calc(12px + env(safe-area-inset-top)) 13px calc(13px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.header{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:2px;color:#aaa}
.pill{border:1px solid #555;border-radius:5px;padding:5px 7px}
.display{position:relative;flex:1;min-height:400px;border:3px solid #333;border-radius:18px;background:#020202;box-shadow:inset 0 0 35px #000,0 8px 25px #000;overflow:hidden;padding:14px}
.scanlines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(255,255,255,.025) 6px);pointer-events:none}
.readout{text-align:center;position:relative;z-index:2}
.number{font-size:clamp(34px,10.5vw,54px);font-weight:800;letter-spacing:3px}
.state{font-size:11px;letter-spacing:2px;margin-top:2px}
.class{font-size:17px;letter-spacing:3px;margin-top:7px}
.visual{position:absolute;inset:112px 13px 20px;display:flex;align-items:flex-end;gap:3px}
.bar{flex:1;min-width:2px;border-radius:2px 2px 0 0;transition:height .08s ease,opacity .08s}
.vector{position:absolute;inset:125px 20px 30px;display:grid;place-items:center}
.vector svg{width:100%;height:100%;overflow:visible}
.core{position:absolute;width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 18px 5px currentColor}
.decay{position:absolute;inset:130px 35px 35px;display:flex;flex-direction:column;justify-content:center;gap:13px;text-align:center}
.energy{height:30px;border:2px solid #aaa;padding:3px;display:flex;gap:2px}
.cell{flex:1;background:#ddd;opacity:.85;transition:opacity .12s}
.decay-value{font-size:28px;letter-spacing:2px}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.measure{height:78px;border:2px solid #444;border-radius:13px;background:#181818;color:#eee;font:inherit;font-weight:800;letter-spacing:1px;box-shadow:inset 0 -5px 10px #000}
.measure small{display:block;font-size:9px;margin-top:5px;font-weight:400;opacity:.8}
.measure.active{box-shadow:inset 0 -3px 0 rgba(255,255,255,.35),0 0 14px currentColor}
.yellow{color:#ffd51a}.red{color:#ff4747}.green{color:#45e86b}
.subcontrols{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px}
.ctrl{height:49px;border:1px solid #555;border-radius:10px;background:#151515;color:#eee;font:inherit;font-size:11px;font-weight:800}
.ctrl.active{border-color:#ddd;background:#292929}
.power{height:62px;border:2px solid #777;border-radius:13px;background:#151515;color:#fff;font:inherit;font-weight:900;letter-spacing:2px}
.power.on{border-color:#f44;box-shadow:0 0 16px rgba(255,60,60,.35)}
.hint{text-align:center;color:#777;font-size:9px;letter-spacing:1px}
</style>
</head>
<body>
<main class="app">
  <div class="header"><span>PKE // FIELD PROTOTYPE</span><span id="net" class="pill">OFFLINE READY</span></div>
  <section class="display" id="display">
    <div class="scanlines"></div>
    <div class="readout">
      <div class="number" id="number">10000.0</div>
      <div class="state" id="state">SYSTEM STANDBY</div>
      <div class="class" id="class">—</div>
    </div>
    <div class="visual" id="bars"></div>
    <div class="vector" id="vector" hidden></div>
    <div class="decay" id="decay" hidden>
      <div>ENTITY ENERGY</div>
      <div class="energy" id="energy"></div>
      <div class="decay-value" id="decayValue">000.0</div>
      <div>DECAY RATE</div>
    </div>
  </section>

  <section class="controls">
    <button class="measure yellow active" data-mode="density">YELLOW<small>SPD • PARTICLE DENSITY</small></button>
    <button class="measure red" data-mode="velocity">RED<small>SPV • SPECTRAL VELOCITY</small></button>
    <button class="measure green" data-mode="decay">GREEN<small>SDR • SPECTRAL DECAY</small></button>
  </section>

  <section class="subcontrols">
    <button class="ctrl" id="auto">AUTO</button>
    <button class="ctrl" id="hold">HOLD</button>
    <button class="ctrl" id="up">▲ UP</button>
    <button class="ctrl" id="down">▼ DOWN</button>
  </section>

  <button class="power" id="power">ACTIVATE</button>
  <div class="hint">MANUAL SCAN OVERRIDES AUTO • TAP AUTO TO RESUME</div>
</main>

<script>
const $=id=>document.getElementById(id);
let active=false, auto=false, hold=false, mode='density', value=10000;
let direction=0, velocity=0, decay=0;
const bars=$('bars'), vector=$('vector'), decayBox=$('decay'), energy=$('energy');
for(let i=0;i<38;i++){const b=document.createElement('div');b.className='bar';bars.appendChild(b)}
for(let i=0;i<20;i++){const c=document.createElement('div');c.className='cell';energy.appendChild(c)}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function severity(){return clamp((5000-value)/5000,0,1)}
function className(){
 if(value>5000)return 'NO PKE DETECTED';
 if(value>3000)return 'PKE DETECTED';
 if(value>=1984)return 'CLASS I–II';
 if(value>=1555)return 'CLASS III–IV';
 if(value>=1333.5)return 'CLASS V';
 if(value>=500)return 'CLASS VI';
 return 'CLASS VII';
}
function colour(){
 if(value>3000)return '#d7d7d7';
 if(value>=1984)return '#45e86b';
 if(value>=1555)return '#ffd51a';
 if(value>=1333.5)return '#ff9a18';
 if(value>=500)return '#ff6418';
 return '#ff3030';
}
function render(){
 $('number').textContent=value.toFixed(1).padStart(7,'0');
 $('class').textContent=className();
 $('display').style.color=colour();
 $('state').textContent=!active?'SYSTEM STANDBY':hold?'READING HELD':auto?'AUTO SCAN':'MANUAL SCAN';
 if(mode==='density'){
   bars.hidden=false; vector.hidden=true; decayBox.hidden=true;
   const s=severity();
   [...bars.children].forEach((b,i)=>{
     const noise=(Math.random()-0.5)*s*75;
     const wave=(Math.sin(i*.72+performance.now()/170)*(10+50*s));
     const h=clamp(12+s*35+wave+noise,3,100);
     b.style.height=h+'%'; b.style.opacity=.35+s*.65;
   });
 }else if(mode==='velocity'){
   bars.hidden=true; vector.hidden=false; decayBox.hidden=true;
   const ang=direction;
   const len=35+velocity*105;
   vector.innerHTML=`<svg viewBox="0 0 100 100">
   <circle cx="50" cy="50" r="4" fill="currentColor"/>
   <line x1="50" y1="50" x2="${50+Math.cos(ang)*len/2}" y2="${50+Math.sin(ang)*len/2}" stroke="currentColor" stroke-width="2.2"/>
   <polygon points="${50+Math.cos(ang)*len/2},${50+Math.sin(ang)*len/2} ${50+Math.cos(ang+2.6)*8+Math.cos(ang)*len/2},${50+Math.sin(ang+2.6)*8+Math.sin(ang)*len/2} ${50+Math.cos(ang-2.6)*8+Math.cos(ang)*len/2},${50+Math.sin(ang-2.6)*8+Math.sin(ang)*len/2}" fill="currentColor"/>
   <circle cx="50" cy="50" r="${18+velocity*22}" fill="none" stroke="currentColor" opacity=".25" stroke-width="1"/></svg>`;
 }else{
   bars.hidden=true; vector.hidden=true; decayBox.hidden=false;
   const d=decay;
   [...energy.children].forEach((c,i)=>c.style.opacity=i/20<1-d?.95:.08);
   $('decayValue').textContent=(d*100).toFixed(1).padStart(5,'0');
 }
}
function tick(){
 if(active&&!hold){
   if(auto){ value += (Math.random()-.56)*260; }
   velocity=clamp(Math.abs((Math.sin(performance.now()/800)+Math.random()*.8)/2)*severity(),0,1);
   direction += (Math.random()-.48)*.18*(.3+severity());
   decay=clamp(severity()*(.55+.45*Math.random()),0,1);
   value=clamp(value,0,10000);
   render();
 }
 requestAnimationFrame(tick);
}
document.querySelectorAll('.measure').forEach(btn=>btn.onclick=()=>{mode=btn.dataset.mode;document.querySelectorAll('.measure').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()});
$('power').onclick=()=>{active=!active;$('power').textContent=active?'DEACTIVATE':'ACTIVATE';$('power').classList.toggle('on',active);if(!active){hold=false;auto=false;$('auto').classList.remove('active');$('hold').classList.remove('active');value=10000}render()};
$('auto').onclick=()=>{if(!active)return;auto=!auto;hold=false;$('auto').classList.toggle('active',auto);$('hold').classList.remove('active');render()};
$('hold').onclick=()=>{if(!active)return;hold=!hold;$('hold').classList.toggle('active',hold);render()};
$('up').onclick=()=>{if(!active)return;auto=false;hold=false;value=clamp(value+250,0,10000);$('auto').classList.remove('active');$('hold').classList.remove('active');render()};
$('down').onclick=()=>{if(!active)return;auto=false;hold=false;value=clamp(value-250,0,10000);$('auto').classList.remove('active');$('hold').classList.remove('active');render()};
window.addEventListener('online',()=>{$('net').textContent='ONLINE';});
window.addEventListener('offline',()=>{$('net').textContent='OFFLINE READY';});
render();tick();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
