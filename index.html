<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080909">
<link rel="manifest" href="manifest.json">
<title>PKE Field Prototype v3</title>
<style>
@font-face{font-family:EurostileLocal;src:local("Eurostile"),local("Eurostile Extended"),local("Microgramma")}
:root{--bg:#080909;--line:#42605a;--dim:#78918b;--text:#e6ece9;--mono:"Courier New",Courier,monospace;--display:EurostileLocal,"Arial Narrow",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{min-height:100svh;display:flex;justify-content:center;overflow:hidden}
.app{width:min(100%,430px);height:100svh;padding:calc(9px + env(safe-area-inset-top)) 11px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.top{height:23px;display:flex;justify-content:space-between;align-items:center;font:9px var(--mono);letter-spacing:1.2px;color:#9aa6a3}
.status{border:1px solid #58635f;padding:3px 5px;border-radius:3px}
.instrument{position:relative;flex:1;min-height:390px;background:#020303;border:2px solid #3e4745;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 35px #000,0 6px 18px #000}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(90,125,116,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(90,125,116,.18) 1px,transparent 1px);background-size:22px 22px}
.grid:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(125,165,153,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(125,165,153,.08) 1px,transparent 1px);background-size:110px 110px}
.scanlines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(255,255,255,.022) 6px)}
.readout{position:absolute;z-index:10;top:10px;left:10px;right:10px;height:84px;padding:5px 7px;background:rgba(2,3,3,.9);border:1px solid #46504d;text-align:center}
.number{font:800 clamp(31px,9.7vw,49px) var(--mono);letter-spacing:2px;line-height:1}
.state{font:9px var(--mono);letter-spacing:1.4px;margin-top:5px}
.class{font:16px var(--display),var(--mono);letter-spacing:2px;margin-top:4px}
.modeTag{position:absolute;left:7px;top:7px;font:8px var(--mono);letter-spacing:1px;color:#93a7a1}
.displayArea{position:absolute;z-index:4;left:9px;right:9px;top:103px;bottom:9px}
.hidden{display:none!important}

/* DENSITY */
.densityScale{position:absolute;left:0;top:0;bottom:0;width:22px;border-right:1px solid #53645f;font:7px var(--mono);color:#81918d}
.densityScale span{position:absolute;left:0}
.densityScale .s100{top:0}.densityScale .s75{top:25%}.densityScale .s50{top:50%}.densityScale .s25{top:75%}.densityScale .s0{bottom:0}
.bars{position:absolute;left:30px;right:2px;top:0;bottom:0;display:grid;grid-template-columns:repeat(24,1fr);gap:3px;align-items:end;border-bottom:1px solid #5b6c67}
.bar{min-height:2px;border:1px solid currentColor;background:currentColor;box-shadow:0 0 6px currentColor;opacity:.82}
.densityLabel{position:absolute;right:2px;top:-1px;font:8px var(--mono);letter-spacing:1px}

/* VELOCITY */
.velocityGrid{position:absolute;inset:0;border:1px solid #42504d}
.velocityGrid:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(110,150,140,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(110,150,140,.2) 1px,transparent 1px);background-size:24px 24px}
.axisH,.axisV{position:absolute;background:#668078;opacity:.5}.axisH{left:0;right:0;top:50%;height:1px}.axisV{top:0;bottom:0;left:50%;width:1px}
.steps{position:absolute;inset:0}
.step{position:absolute;width:10px;height:10px;border:1px solid currentColor;background:currentColor;box-shadow:0 0 7px currentColor}
.velocityRead{position:absolute;bottom:5px;left:7px;font:11px var(--mono);letter-spacing:1px;background:rgba(0,0,0,.65);padding:3px 5px}
.velocityHint{position:absolute;top:5px;right:6px;font:8px var(--mono);letter-spacing:1px}

/* DECAY */
.decay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:9px var(--mono);letter-spacing:1.2px}
.core{width:112px;height:112px;border:1px solid currentColor;position:relative;display:grid;place-items:center;font:18px var(--display),var(--mono);letter-spacing:2px}
.core:before,.core:after{content:"";position:absolute;border:1px solid currentColor}
.core:before{inset:13px}.core:after{inset:31px}
.core i{position:absolute;width:100%;height:1px;background:currentColor;top:50%;left:0;opacity:.5}.core b{position:absolute;height:100%;width:1px;background:currentColor;left:50%;top:0;opacity:.5}
.decayRead{font:24px var(--mono);letter-spacing:2px}
.energy{width:82%;height:17px;border:1px solid currentColor;padding:2px;display:grid;grid-template-columns:repeat(20,1fr);gap:2px}
.cell{background:currentColor;min-width:0}
.decayScale{width:82%;display:flex;justify-content:space-between;font-size:7px;color:#879793}

/* CONTROLS */
.measure{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
button{touch-action:manipulation}
.measure button{height:71px;border:2px solid #424846;border-radius:10px;background:#151716;color:#ddd;font:800 10px var(--display),var(--mono);letter-spacing:1px}
.measure button small{display:block;margin-top:5px;font:8px var(--mono);letter-spacing:.3px;color:#9da8a5}
.measure button.active{box-shadow:inset 0 -3px 0 rgba(255,255,255,.32),0 0 14px currentColor}
.yellow{color:#ffd51a}.red{color:#ff4a4a}.green{color:#4ee879}
.sub{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sub button{height:45px;border:1px solid #515855;border-radius:8px;background:#141515;color:#eee;font:800 9px var(--display),var(--mono);letter-spacing:.6px}
.sub button.active{background:#282c2b;border-color:#ddd}
.power{height:58px;border:2px solid #777;border-radius:10px;background:#151616;color:#fff;font:900 12px var(--display),var(--mono);letter-spacing:2px}
.power.on{border-color:#e64a4a;box-shadow:0 0 15px rgba(230,70,70,.3)}
.note{text-align:center;height:11px;color:#68716f;font:7px var(--mono);letter-spacing:.8px}
</style>
</head>
<body>
<main class="app">
<div class="top"><span>PKE // FIELD PROTOTYPE 03</span><span id="net" class="status">OFFLINE READY</span></div>
<section class="instrument" id="instrument">
<div class="grid"></div><div class="scanlines"></div>
<div class="readout"><div class="modeTag" id="modeTag">SPD</div><div class="number" id="number">10000.0</div><div class="state" id="state">SYSTEM STANDBY</div><div class="class" id="class">—</div></div>

<div class="displayArea" id="densityView">
<div class="densityScale"><span class="s100">100%</span><span class="s75">75</span><span class="s50">50</span><span class="s25">25</span><span class="s0">0</span></div>
<div class="bars" id="bars"></div><div class="densityLabel">PARTICLE DENSITY</div>
</div>

<div class="displayArea hidden" id="velocityView">
<div class="velocityGrid"><div class="axisH"></div><div class="axisV"></div></div>
<div class="steps" id="steps"></div><div class="velocityHint">VECTOR FIELD</div><div class="velocityRead" id="velocityRead">SPV 000.0</div>
</div>

<div class="displayArea hidden" id="decayView">
<div class="decay"><div>ENTITY ENERGY STATE</div><div class="core" id="core">PKE<i></i><b></b></div><div class="decayRead" id="decayRead">000.0</div><div>SPECTRAL DECAY RATE</div><div class="energy" id="energy"></div><div class="decayScale"><span>STABLE</span><span>ENERGY LOSS</span></div></div>
</div>
</section>

<section class="measure">
<button class="yellow active" data-mode="density">YELLOW<small>SPD · PARTICLE DENSITY</small></button>
<button class="red" data-mode="velocity">RED<small>SPV · SPECTRAL VELOCITY</small></button>
<button class="green" data-mode="decay">GREEN<small>SDR · SPECTRAL DECAY</small></button>
</section>
<section class="sub"><button id="auto">AUTO</button><button id="hold">HOLD</button><button id="up">▲ UP</button><button id="down">▼ DOWN</button></section>
<button class="power" id="power">ACTIVATE</button>
<div class="note">MANUAL SCAN OVERRIDES AUTO · AUTO RESUMES WHEN SELECTED</div>
</main>
<script>
const $=id=>document.getElementById(id);
let active=false,auto=false,hold=false,mode='density',value=10000,direction=1,velocity=0,decay=0;
const bars=$('bars'),steps=$('steps'),energy=$('energy');
for(let i=0;i<24;i++){const b=document.createElement('div');b.className='bar';bars.appendChild(b)}
for(let i=0;i<20;i++){const c=document.createElement('div');c.className='cell';energy.appendChild(c)}
for(let i=0;i<7;i++){const s=document.createElement('div');s.className='step';steps.appendChild(s)}
function sev(){return Math.max(0,Math.min(1,(5000-value)/5000))}
function className(){if(value>5000)return'NO PKE DETECTED';if(value>3000)return'PKE DETECTED';if(value>=1984)return'CLASS I–II';if(value>=1555)return'CLASS III–IV';if(value>=1333.5)return'CLASS V';if(value>=500)return'CLASS VI';return'CLASS VII'}
function color(){if(value>3000)return'#d8dfdc';if(value>=1984)return'#4ee879';if(value>=1555)return'#ffd51a';if(value>=1333.5)return'#ff9b18';if(value>=500)return'#ff671c';return'#ff3030'}
function render(){
 const s=sev(),c=color();
 $('number').textContent=value.toFixed(1).padStart(7,'0');$('class').textContent=className();$('instrument').style.color=c;
 $('state').textContent=!active?'SYSTEM STANDBY':hold?'READING HELD':auto?'AUTO SCAN':'MANUAL SCAN';
 $('modeTag').textContent=mode==='density'?'SPD':mode==='velocity'?'SPV':'SDR';
 $('densityView').classList.toggle('hidden',mode!=='density');$('velocityView').classList.toggle('hidden',mode!=='velocity');$('decayView').classList.toggle('hidden',mode!=='decay');
 if(mode==='density'){
   [...bars.children].forEach((b,i)=>{const envelope=Math.max(0,Math.sin(i/23*Math.PI));const noise=(Math.random()-.5)*(8+72*s);const wave=Math.sin(i*.78+performance.now()/135)*(3+42*s);b.style.height=Math.max(2,Math.min(100,8+s*45*envelope+wave+noise))+'%';b.style.opacity=.4+s*.6});
 }
 if(mode==='velocity'){
   const cx=50,cy=50;const magnitude=18+velocity*33;const dx=Math.cos(direction)*magnitude,dy=Math.sin(direction)*magnitude;
   [...steps.children].forEach((el,i)=>{const t=(i-3)/3;const x=cx+dx*t,y=cy+dy*t;el.style.left=`calc(${x}% - 5px)`;el.style.top=`calc(${y}% - 5px)`;el.style.opacity=.25+.75*(1-Math.abs(t))});
   $('velocityRead').textContent='SPV '+(velocity*100).toFixed(1).padStart(5,'0');
 }
 if(mode==='decay'){[...energy.children].forEach((x,i)=>x.style.opacity=i/20<(1-decay)?.95:.07);$('decayRead').textContent=(decay*100).toFixed(1).padStart(5,'0');$('core').style.opacity=.3+.7*(1-decay)}
}
function tick(){
 if(active&&!hold){
   if(auto)value+=(Math.random()-.57)*230;
   value=Math.max(0,Math.min(10000,value));
   const s=sev();velocity=Math.min(1,(.15+Math.abs(Math.sin(performance.now()/760))*.55+Math.random()*.3)*s);
   direction+=((Math.random()-.5)*.12)*(0.4+s);if(Math.random()<.008)direction+=Math.PI;
   decay=Math.min(1,s*(.45+.55*Math.random()));render();
 }
 requestAnimationFrame(tick)
}
document.querySelectorAll('.measure button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.measure button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});
$('power').onclick=()=>{active=!active;$('power').textContent=active?'DEACTIVATE':'ACTIVATE';$('power').classList.toggle('on',active);if(!active){auto=false;hold=false;value=10000;$('auto').classList.remove('active');$('hold').classList.remove('active')}render()};
$('auto').onclick=()=>{if(!active)return;auto=!auto;hold=false;$('auto').classList.toggle('active',auto);$('hold').classList.remove('active');render()};
$('hold').onclick=()=>{if(!active)return;hold=!hold;$('hold').classList.toggle('active',hold);render()};
$('up').onclick=()=>{if(!active)return;auto=false;hold=false;value=Math.min(10000,value+250);$('auto').classList.remove('active');$('hold').classList.remove('active');render()};
$('down').onclick=()=>{if(!active)return;auto=false;hold=false;value=Math.max(0,value-250);$('auto').classList.remove('active');$('hold').classList.remove('active');render()};
window.addEventListener('online',()=>{$('net').textContent='ONLINE'});window.addEventListener('offline',()=>{$('net').textContent='OFFLINE READY'});
render();tick();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
